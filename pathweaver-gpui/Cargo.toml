[package]
name = "pathweaver-gpui"
version = "0.2.0"
edition = "2024"
default-run = "pathweaver"

[[bin]]
name = "pathweaver"
path = "src/main.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
pathweaver-core = { path = "../pathweaver-core" }
kurbo = "0.11"
serde_json = "1"
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
block = "0.1.6"
cocoa = "0.26.0"
raw-window-handle = "0.6.2"
async-channel = "2.5.0"

[profile.dev]
opt-level = 1
