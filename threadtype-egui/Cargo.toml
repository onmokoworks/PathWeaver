[package]
name = "threadtype"
version = "0.1.0"
edition = "2021"
description = "円形ペグ・フォント制作ツール（タウトストリング方式）"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_dock = "0.14"
kurbo = { version = "0.11", features = ["serde"] }
lyon = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
ab_glyph = "0.2"
geo = "0.29"

[profile.dev]
opt-level = 1
